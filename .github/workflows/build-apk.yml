name: Build APK Helldivers BR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar assinatura permanente
        shell: bash
        env:
          HD_SIGNING_KEYSTORE_BASE64: ${{ secrets.HD_SIGNING_KEYSTORE_BASE64 }}
          HD_SIGNING_PASSWORD: ${{ secrets.HD_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$HD_SIGNING_KEYSTORE_BASE64" ] || [ -z "$HD_SIGNING_PASSWORD" ]; then
            echo "Cadastre HD_SIGNING_KEYSTORE_BASE64 e HD_SIGNING_PASSWORD nos Secrets do repositório."
            exit 1
          fi
          python3 - <<'PYKEY'
          import base64, os
          from pathlib import Path
          dest = Path(os.environ['RUNNER_TEMP']) / 'hd2-br.p12'
          dest.write_bytes(base64.b64decode(os.environ['HD_SIGNING_KEYSTORE_BASE64'].strip(), validate=True))
          dest.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'HD_SIGNING_STORE_FILE={dest}\n')
          PYKEY
          actual=$(keytool -exportcert -alias hd2-br -keystore "$RUNNER_TEMP/hd2-br.p12" -storepass:env HD_SIGNING_PASSWORD | sha256sum | cut -d ' ' -f 1)
          if [ "$actual" != "a5181edc2a9444b4a15aeca89c274809ae1e9f718239e10c08d925ee8546bd33" ]; then
            echo "A chave não corresponde à assinatura permanente deste projeto."
            exit 1
          fi

      - name: Verificar estados, recompensas e regiões
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Habilitar emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testar toques e navegação no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: >-
            bash -c 'status=0;
            gradle :app:connectedDebugAndroidTest --stacktrace || status=$?;
            mkdir -p app/build/navigation-failures;
            adb pull /sdcard/Android/data/br.com.helldiversbr.app/files/navigation-failures/. app/build/navigation-failures/ || true;
            exit "$status"'

      - name: Guardar relatório dos testes de navegação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Relatorio-navegacao
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/navigation-failures/
          if-no-files-found: ignore

      - name: Compilar APK Release assinado
        env:
          HD_SIGNING_PASSWORD: ${{ secrets.HD_SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verificar assinatura do APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          report="$RUNNER_TEMP/hd-apk-cert.txt"
          if [ ! -f "$apk" ]; then
            echo "::error::APK Release não encontrado em $apk. Confira a etapa de compilação."
            exit 1
          fi
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$signer" ] || [ ! -x "$signer" ]; then
            echo "::error::apksigner não encontrado no Android SDK."
            exit 1
          fi
          echo "Ferramenta: $signer"
          if ! "$signer" verify --verbose --print-certs "$apk" > "$report" 2>&1; then
            cat "$report"
            echo "::error::O apksigner rejeitou o APK; diagnóstico exibido acima."
            exit 1
          fi
          # O relatório contém apenas os dados públicos do certificado.
          cat "$report"
          python3 - <<'PYCERT'
          import os, re
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'hd-apk-cert.txt'
          expected = 'a5181edc2a9444b4a15aeca89c274809ae1e9f718239e10c08d925ee8546bd33'
          text = report.read_text(errors='replace')
          digests = {
              value.lower() for value in re.findall(
                  r'certificate\s+SHA-256\s+digest:\s*([0-9a-fA-F]{64})(?![0-9a-fA-F])',
                  text, flags=re.IGNORECASE,
              )
          }
          if not digests:
              raise SystemExit('::error::Não foi possível ler o SHA-256 do certificado no relatório acima.')
          if digests != {expected}:
              raise SystemExit('::error::O certificado do APK difere da chave permanente. SHA-256 observado: ' + ', '.join(sorted(digests)))
          print('Certificado permanente do APK confirmado.')
          PYCERT
          cp "$apk" Helldivers-BR.apk

      - name: Guardar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Helldivers-BR-apk
          path: Helldivers-BR.apk
          retention-days: 30

      - name: Limpar chave temporária
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/hd2-br.p12"
