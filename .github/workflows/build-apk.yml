name: Build APK Helldivers BR

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verificar estados, recompensas e regioes
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compilar APK (debug)
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Helldivers-BR.apk

      - name: Guardar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Helldivers-BR-apk
          path: Helldivers-BR.apk
          retention-days: 30

      - name: Publicar em Release (só quando disparado por tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Helldivers-BR.apk
